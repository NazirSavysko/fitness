version: '3.8'

services:
  postgres:
    image: 'postgres:16.13'
    env_file:
      - .env
    networks:
      - fitness
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  fitness-app:
    build: .
    ports:
      - '8081:8080'
    env_file:
      - .env
    networks:
      - fitness
    depends_on:
      postgres:
        condition: service_healthy

networks:
  fitness:
    driver: bridge

volumes:
  postgres_data: