version: '3.0'

services:
  postgres:
    image: 'postgres:17.6'
    env_file:
      - .env
    networks:
      - fitness
    ports:
      - '5432:5432'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  fitness-app:
    build: .
    ports:
      - '8080:8080'
    env_file:
      - .env
    networks:
      - fitness
    depends_on:
      postgres:
        condition: service_healthy

networks:
  fitness:
    driver: bridge