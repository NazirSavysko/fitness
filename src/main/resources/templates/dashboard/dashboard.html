<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div class="page-container">

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-content">
            <div class="logo">
                <h2>FitApp</h2>
                <button class="close-menu-btn" onclick="toggleMenu()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <nav class="menu">
                <a href="/dashboard" class="menu-item active">
                    <i class="fa-solid fa-house menu-icon"></i> Dashboard
                </a>
                <a href="/templates" class="menu-item">
                    <i class="fa-solid fa-dumbbell menu-icon"></i> Templates
                </a>
                <a href="/history" class="menu-item">
                    <i class="fa-solid fa-clock-rotate-left menu-icon"></i> History
                </a>
                <a href="/settings" class="menu-item">
                    <i class="fa-solid fa-gear menu-icon"></i> Settings
                </a>
            </nav>
        </div>

        <div class="sidebar-footer">
            <form method="post" th:action="@{/auth/logout}">
                <button type="submit" class="logout-link">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </form>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <button class="menu-toggle" onclick="toggleMenu()">
                <i class="fa-solid fa-bars"></i>
            </button>
        </header>

        <div class="dashboard-content">
            <section class="calendar-card">
                <div class="calendar-header">
                    <p class="calendar-kicker">Workout schedule</p>
                    <div class="calendar-nav">
                        <button type="button" class="calendar-nav-btn" id="prevWeekBtn" aria-label="Previous week">
                            <i class="fa-solid fa-arrow-left"></i>
                        </button>
                        <h2 id="calendarMonthLabel" class="calendar-month-label">March 2026</h2>
                        <button type="button" class="calendar-nav-btn" id="nextWeekBtn" aria-label="Next week">
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                </div>
                <div id="weeklyCalendar" class="weekly-calendar"></div>
            </section>

            <section id="completedDayCard" class="completed-day-card" hidden>
                <div class="completed-day-icon">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
                <div class="completed-day-copy">
                    <h3>Workout already done for this day</h3>
                    <p>One workout per day is enabled, so template starts are disabled for the selected date.</p>
                </div>
                <a href="/history" class="completed-day-link">Open history</a>
            </section>

            <section id="templatesSection" class="templates-section">
                <div class="templates-section-header">
                    <h3 class="section-title">My Templates</h3>
                    <a href="/templates" class="section-link">Manage</a>
                </div>

                <div id="templateGrid" class="template-grid"></div>

                <div id="emptyTemplateState" class="empty-template-state" th:if="${#lists.isEmpty(templates)}">
                    <p>No templates yet.</p>
                    <a href="/templates/create">Create your first template</a>
                </div>
            </section>
        </div>
    </main>
</div>

<script th:src="@{/js/menu-toggle.js}"></script>
<script th:inline="javascript">
    const templates = /*[[${templates}]]*/ [];
    const templateScheduleByTemplateId = /*[[${templateScheduleByTemplateId}]]*/ {};
    const completedWorkoutDayKeys = /*[[${completedWorkoutDayKeys}]]*/ [];

    const weeklyCalendar = document.getElementById('weeklyCalendar');
    const calendarMonthLabel = document.getElementById('calendarMonthLabel');
    const templateGrid = document.getElementById('templateGrid');
    const completedDayCard = document.getElementById('completedDayCard');
    const templatesSection = document.getElementById('templatesSection');
    const emptyTemplateState = document.getElementById('emptyTemplateState');

    const today = new Date();
    let currentWeekStartDate = startOfWeek(today);
    let selectedDate = new Date(today);

    document.getElementById('prevWeekBtn').addEventListener('click', () => {
        currentWeekStartDate = shiftDate(currentWeekStartDate, -7);
        renderCalendar();
    });

    document.getElementById('nextWeekBtn').addEventListener('click', () => {
        currentWeekStartDate = shiftDate(currentWeekStartDate, 7);
        renderCalendar();
    });

    function shiftDate(baseDate, offsetDays) {
        const next = new Date(baseDate);
        next.setDate(next.getDate() + offsetDays);
        return next;
    }

    function startOfWeek(inputDate) {
        const date = new Date(inputDate);
        const day = date.getDay();
        const diff = day === 0 ? -6 : 1 - day;
        date.setHours(0, 0, 0, 0);
        date.setDate(date.getDate() + diff);
        return date;
    }

    function formatDateKey(date) {
        return date.toISOString().split('T')[0];
    }

    function formatWeekdayKey(date) {
        return date.toLocaleDateString('en-US', {weekday: 'long'}).toUpperCase();
    }

    function normalizeToArray(value) {
        if (Array.isArray(value)) {
            return value;
        }
        if (!value) {
            return [];
        }
        if (typeof value === 'object') {
            return Object.values(value).flatMap((item) => normalizeToArray(item));
        }
        return [value];
    }

    function tokenMatchesDate(token, dayKey, dateKey) {
        const normalized = String(token || '').toUpperCase();
        return normalized === dayKey || normalized === dateKey;
    }

    function hasCompletedWorkout(date) {
        const dateKey = formatDateKey(date);
        const dayKey = formatWeekdayKey(date);
        return normalizeToArray(completedWorkoutDayKeys).some((token) => tokenMatchesDate(token, dayKey, dateKey));
    }

    function getTemplateScheduleTokens(templateId) {
        if (!templateScheduleByTemplateId || !templateScheduleByTemplateId[templateId]) {
            return [];
        }
        return normalizeToArray(templateScheduleByTemplateId[templateId]);
    }

    function isTemplateScheduledForDate(template, date) {
        const dateKey = formatDateKey(date);
        const dayKey = formatWeekdayKey(date);
        return getTemplateScheduleTokens(template.id).some((token) => tokenMatchesDate(token, dayKey, dateKey));
    }

    function hasScheduledTemplate(date) {
        return templates.some((template) => isTemplateScheduledForDate(template, date));
    }

    function renderDay(date) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'day-btn';

        const dateLabel = date.getDate();
        const weekDayLabel = date.toLocaleDateString('en-US', {weekday: 'short'}).charAt(0).toUpperCase();
        const selected = formatDateKey(date) === formatDateKey(selectedDate);
        const planned = hasScheduledTemplate(date);
        const completed = hasCompletedWorkout(date);

        if (selected) {
            button.classList.add('active');
        }

        if (formatDateKey(date) === formatDateKey(today)) {
            button.classList.add('today');
        }

        button.innerHTML = `
            <span class="weekday-label">${weekDayLabel}</span>
            <span class="date-label">${dateLabel}</span>
            <span class="indicator-row">
                ${planned ? '<span class="indicator-dot planned"></span>' : ''}
                ${completed ? '<span class="indicator-dot completed"></span>' : ''}
            </span>
        `;

        button.addEventListener('click', () => {
            selectedDate = new Date(date);
            renderCalendar();
            renderTemplates();
            updateSelectedDayState();
        });

        return button;
    }

    function renderCalendar() {
        weeklyCalendar.innerHTML = '';
        const monthText = currentWeekStartDate.toLocaleDateString('en-US', {month: 'long', year: 'numeric'});
        calendarMonthLabel.textContent = monthText;

        for (let offset = 0; offset < 7; offset++) {
            const dayDate = shiftDate(currentWeekStartDate, offset);
            weeklyCalendar.appendChild(renderDay(dayDate));
        }
    }

    function renderTemplates() {
        if (emptyTemplateState) {
            emptyTemplateState.hidden = templates.length !== 0;
        }
        if (!templateGrid) {
            return;
        }

        templateGrid.innerHTML = '';
        const completed = hasCompletedWorkout(selectedDate);
        const sortedTemplates = [...templates].sort((templateA, templateB) => {
            const leftScheduled = isTemplateScheduledForDate(templateA, selectedDate);
            const rightScheduled = isTemplateScheduledForDate(templateB, selectedDate);
            if (leftScheduled === rightScheduled) {
                return templateA.name.localeCompare(templateB.name);
            }
            return leftScheduled ? -1 : 1;
        });

        sortedTemplates.forEach((template) => {
            const scheduled = isTemplateScheduledForDate(template, selectedDate);
            const card = document.createElement('form');
            card.method = 'post';
            card.action = '/workouts/start';
            card.className = `template-card${scheduled ? ' scheduled' : ''}${completed ? ' locked' : ''}`;

            const badgeText = scheduled ? 'Scheduled' : 'Available';

            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'templateId';
            input.value = String(template.id ?? '');

            const cardButton = document.createElement('button');
            cardButton.type = 'submit';
            cardButton.className = 'template-card-btn';
            cardButton.disabled = completed;

            const cardHeader = document.createElement('div');
            cardHeader.className = 'template-card-header';
            const title = document.createElement('h4');
            title.textContent = String(template.name || '');

            const badge = document.createElement('span');
            badge.className = 'template-badge';
            badge.textContent = badgeText;
            cardHeader.appendChild(title);
            cardHeader.appendChild(badge);

            const startRow = document.createElement('div');
            startRow.className = 'template-start-row';

            const icon = document.createElement('i');
            icon.className = 'fa-solid fa-play';
            icon.setAttribute('aria-hidden', 'true');

            const label = document.createElement('span');
            label.textContent = 'Start';

            startRow.appendChild(icon);
            startRow.appendChild(label);

            cardButton.appendChild(cardHeader);
            cardButton.appendChild(startRow);

            card.appendChild(input);
            card.appendChild(cardButton);

            templateGrid.appendChild(card);
        });
    }

    function updateSelectedDayState() {
        const completed = hasCompletedWorkout(selectedDate);
        completedDayCard.hidden = !completed;
        templatesSection.hidden = completed;
    }

    renderCalendar();
    renderTemplates();
    updateSelectedDayState();
</script>

</body>
</html>
