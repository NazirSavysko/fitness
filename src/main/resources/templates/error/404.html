<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Page Not Found</title>
    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body>
<div class="error-container">
    <div class="error-code">404</div>
    <h2 class="error-title">Something Not Found</h2>
    <p class="error-message">
        The something you are looking for does not exist.<br>
        It might have been removed, or you may have typed the URL incorrectly.
    </p>
    <a href="/auth/login" class="home-button">Go Home</a>
</div>
</body>
</html>
