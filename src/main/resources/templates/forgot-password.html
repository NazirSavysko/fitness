<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link media="all" rel="stylesheet" th:href="@{/css/login.css}" type="text/css"/>
    <title>Forgot Password</title>
</head>
<body>
<div class="main-container">

    <form class="login-form" th:action="@{/auth/forgot-password}" method="post" th:object="${forgotPasswordDto}">

        <h1 class="form-title">Reset Password</h1>

        <p style="text-align: center; color: #36454F; margin-bottom: 20px;">
            Enter your email and we'll send you a link to reset your password.
        </p>

        <div class="error-login" th:if="${param.error}">
            <p class="text-error">User with this email not found.</p>
        </div>

        <div class="alert-success" th:if="${param.success}">
            <p class="text-success">Check your email for the reset link.</p>
        </div>

        <div class="form-group">
            <label for="email" class="form-label">Enter your email:</label>
            <input type="text"
                   id="email"
                   th:field="*{email}"
                   class="form-input"
                   placeholder="example@email.com"
                   required>
            <div style="color: #dc3545; font-size: 0.9rem; margin-top: 5px;"
                 th:if="${#fields.hasErrors('email')}"
                 th:errors="*{email}">Error</div>
        </div>

        <button type="submit" class="submit-button">Send Link</button>

        <div class="auth-footer">
            <a th:href="@{/auth/log-in}" class="glow-link">Back to Log in</a>
        </div>
    </form>
</div>

</body>
</html>
