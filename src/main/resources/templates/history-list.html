<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout History</title>
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }
        .history-card {
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1 1 300px;
        }
        .history-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            color: #6b7280;
            font-size: 0.92rem;
        }
        .history-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .summary-badge {
            background: #e9f0ff;
            color: #4318FF;
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 0.8rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="page-container">
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-content">
            <div class="logo">
                <h2>FitApp</h2>
                <button class="close-menu-btn" onclick="toggleMenu()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <nav class="menu">
                <a href="/dashboard" class="menu-item"><i class="fa-solid fa-house menu-icon"></i> Dashboard</a>
                <a href="/templates" class="menu-item"><i class="fa-solid fa-dumbbell menu-icon"></i> Templates</a>
                <a href="/settings" class="menu-item"><i class="fa-solid fa-gear menu-icon"></i> Settings</a>
                <a href="/history" class="menu-item active"><i class="fa-solid fa-clock-rotate-left menu-icon"></i> History</a>
            </nav>
        </div>
        <div class="sidebar-footer">
            <form method="post" th:action="@{/auth/logout}">
                <button type="submit" class="logout-link">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </form>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <button class="menu-toggle" onclick="toggleMenu()">
                <i class="fa-solid fa-bars"></i>
            </button>
        </header>

        <div class="dashboard-grid">
            <div class="card full-width-card" th:if="${historyPage.content.isEmpty()}">
                <h3 class="card-title">Workout History</h3>
                <div class="empty-state">
                    <p>No completed workouts yet.</p>
                </div>
            </div>

            <div class="history-list" th:if="${!historyPage.content.isEmpty()}">
                <a class="card history-card" th:each="workout : ${historyPage.content}"
                   th:href="@{/history/{id}(id=${workout.sessionId})}">
                    <h3 class="card-title" th:text="${workout.name}">Workout Name</h3>
                    <div class="history-meta">
                        <span><i class="fa-regular fa-calendar"></i> <span th:text="${workout.date}">Date</span></span>
                        <span><i class="fa-regular fa-clock"></i> <span th:text="${workout.durationMinutes} + ' min'">0 min</span></span>
                    </div>
                    <div class="history-badges">
                        <span class="summary-badge" th:text="|Total Sets: ${workout.totalSets}|">Total Sets: 0</span>
                        <span class="summary-badge" th:text="|Muscle Groups: ${workout.muscleGroups}|">Muscle Groups: -</span>
                    </div>
                </a>
            </div>
        </div>

        <div class="workout-actions" th:if="${historyPage.totalPages > 1}" style="margin-top: 20px;">
            <a class="workout-btn template-btn" th:if="${historyPage.hasPrevious()}"
               th:href="@{/history(page=${historyPage.number - 1})}">
                <span class="main-text"><i class="fa-solid fa-chevron-left"></i> Previous</span>
            </a>
            <a class="workout-btn template-btn" th:if="${historyPage.hasNext()}"
               th:href="@{/history(page=${historyPage.number + 1})}">
                <span class="main-text">Next <i class="fa-solid fa-chevron-right"></i></span>
            </a>
        </div>
    </main>
</div>

<script th:src="@{/js/menu-toggle.js}"></script>
</body>
</html>
