<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout History</title>
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/template-details.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="page-container">
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-content">
            <div class="logo">
                <h2>FitApp</h2>
                <button class="close-menu-btn" onclick="toggleMenu()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <nav class="menu">
                <a href="/dashboard" class="menu-item"><i class="fa-solid fa-house menu-icon"></i> Dashboard</a>
                <a href="/templates" class="menu-item"><i class="fa-solid fa-dumbbell menu-icon"></i> Templates</a>
                <a href="/settings" class="menu-item"><i class="fa-solid fa-gear menu-icon"></i> Settings</a>
                <a href="/history" class="menu-item active"><i class="fa-solid fa-clock-rotate-left menu-icon"></i> History</a>
            </nav>
        </div>
        <div class="sidebar-footer">
            <form method="post" th:action="@{/auth/logout}">
                <button type="submit" class="logout-link">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </form>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <button class="menu-toggle" onclick="toggleMenu()">
                <i class="fa-solid fa-bars"></i>
            </button>
        </header>

        <div class="dashboard-grid">
            <div class="card full-width-card" th:if="${historyPage.content.isEmpty()}">
                <h3 class="card-title">Workout History</h3>
                <div class="empty-state">
                    <p>No completed workouts yet.</p>
                </div>
            </div>

            <div class="details-card full-width-card" th:if="${!historyPage.content.isEmpty()}" style="padding: 0; overflow: hidden;">
                <div class="card-header">
                     <h3 class="section-title"><i class="fa-solid fa-clock-rotate-left section-icon"></i> Recent Workouts</h3>
                </div>
                <div class="styled-exercise-list">
                    <a class="exercise-item" th:each="workout, iterStat : ${historyPage.content}"
                       th:href="@{/history/{id}(id=${workout.sessionId})}"
                       style="text-decoration: none; color: inherit; display: flex; align-items: center;">

                        <div class="exercise-info" style="flex: 1;">
                             <div class="exercise-number" th:text="${iterStat.count}">1</div>
                             <div style="display: flex; flex-direction: column; gap: 4px;">
                                 <span class="exercise-name" th:text="${workout.name}">Workout Name</span>
                                 <span style="font-size: 0.85rem; color: #7f8c8d;">
                                     <i class="fa-regular fa-calendar" style="margin-right: 4px;"></i><span th:text="${workout.date}">Date</span>
                                     <span style="margin: 0 6px;">•</span>
                                     <i class="fa-regular fa-clock" style="margin-right: 4px;"></i><span th:text="${workout.durationMinutes} + ' min'">0 min</span>
                                 </span>
                             </div>
                        </div>

                         <div class="history-badges" style="margin-right: 15px; display: flex; gap: 8px;">
                            <span class="badge" style="background: #eaf2f8; color: #3498db; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem;" th:text="${workout.totalSets} + ' Sets'">0 Sets</span>
                        </div>

                        <div class="exercise-actions">
                            <i class="fa-solid fa-chevron-right icon-chevron"></i>
                        </div>
                    </a>
                </div>
            </div>
        </div>

        <div class="workout-actions" th:if="${historyPage.totalPages > 1}" style="margin-top: 20px;">
            <a class="workout-btn template-btn" th:if="${historyPage.hasPrevious()}"
               th:href="@{/history(page=${historyPage.number - 1})}">
                <span class="main-text"><i class="fa-solid fa-chevron-left"></i> Previous</span>
            </a>
            <a class="workout-btn template-btn" th:if="${historyPage.hasNext()}"
               th:href="@{/history(page=${historyPage.number + 1})}">
                <span class="main-text">Next <i class="fa-solid fa-chevron-right"></i></span>
            </a>
        </div>
    </main>
</div>

<script th:src="@{/js/menu-toggle.js}"></script>
</body>
</html>
