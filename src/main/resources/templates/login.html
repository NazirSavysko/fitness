<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link media="all" rel="stylesheet" th:href="@{/css/login-registration.css}" type="text/css"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <title>Log in</title>
</head>
<body>
<div class="main-container">

    <form class="login-form" th:action="@{/api/v1/auth/log-in}" method="post">

        <h1 class="form-title">Log-in form</h1>

        <div class="error-login" th:if="${param.error}">
            <p class="text-error">Invalid email or password</p>
        </div>

        <div th:if="${param.success}" class="alert-success">
            <p class="text-success">Registration successful! Please log in.</p>
        </div>

        <div class="form-group">
            <label for="email" class="form-label">Enter your email:</label>
            <input type="text" id="email" name="email" class="form-input" placeholder="example@email.com" required>
        </div>

        <div class="form-group">
            <label for="password" class="form-label">Enter your password:</label>
            <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
            <button type="button" class="material-symbols-outlined" onclick="togglePassword()">visibility</button>
        </div>

        <button type="submit" class="submit-button">Log in</button>

        <div class="auth-footer">
            <span>Don`t have an account?</span>
            <a th:action="@{/api/v1/auth/register}">Sign up</a>
        </div>
    </form>
</div>

<script th:src="@{/js/password-toggle.js}"></script>
</body>
</html>
