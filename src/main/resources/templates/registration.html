<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link media="all" rel="stylesheet" th:href="@{/css/registration.css}" type="text/css"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <title>Sign up</title>
</head>
<body>
<div class="main-container">

    <form class="registration-form" th:action="@{/auth/register}" th:object="${registrationPayload}" method="post">

        <h1 class="form-title">Sign up form</h1>

        <div class="form-group">
            <label for="email" class="form-label">Enter your email:</label>
            <input type="text" id="email"
                   th:field="*{email}"
                   class="form-input"
                   th:errorclass="input-error"
                   placeholder="example@email.com">
            <div class="field-error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="form-group">
            <label for="password" class="form-label">Enter your password:</label>
            <div style="position: relative">
                <input type="password" id="password"
                       th:field="*{password}"
                       class="form-input"
                       th:errorclass="input-error"
                       placeholder="••••••••">
                <button type="button" class="material-symbols-outlined" onclick="togglePassword('password', this)">visibility</button>
            </div>
            <div class="field-error-text" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>

        <div class="form-group">
            <label for="name" class="form-label">Enter your name:</label>
            <input type="text" id="name"
                   th:field="*{name}"
                   class="form-input"
                   th:errorclass="input-error">
            <div class="field-error-text" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="form-group">
            <label for="surname" class="form-label">Enter your surname:</label>
            <input type="text" id="surname"
                   th:field="*{surname}"
                   class="form-input"
                   th:errorclass="input-error">
            <div class="field-error-text" th:if="${#fields.hasErrors('surname')}" th:errors="*{surname}"></div>
        </div>

        <button type="submit" class="submit-button">Sign up</button>

        <div class="auth-footer">
            <span>Already have an account?</span>
            <a th:href="@{/auth/login}">Log in</a>
        </div>
    </form>
</div>
<script th:src="@{/js/password-toggle.js}"></script>
</body>
</html>
