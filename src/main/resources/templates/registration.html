<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log-in</title>
</head>
<body>
<div class="main-container">

    <form class="registration-form" action="/auth/register" method="post">

        <h1 class="form-title">Sing up form</h1>

        <div class="error-registration" th:if="${param.error}">
            <p class="text-error">Invalid email or password</p>

        </div>

        <div class="form-group">
            <label for="email" class="form-label">Enter your email:</label>

            <input type="text" id="email" name="email" class="form-input" placeholder="example@email.com" required>
        </div>

        <div class="form-group">
            <label for="password" class="form-label">Enter your password:</label>
            <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" class="submit-button">Sing up</button>
        <br>
        <p>Already have an account?</p> <a href="/login">Log in</a>
    </form>
</div>
</body>
</html>
