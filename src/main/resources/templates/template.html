<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Templates</title>

    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/templates.css}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div class="page-container">
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-content">
            <div class="logo">
                <h2>FitApp</h2>
                <button class="close-menu-btn" onclick="toggleMenu()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <nav class="menu">
                <a href="/dashboard" class="menu-item"><i class="fa-solid fa-house menu-icon"></i> Dashboard</a>
                <a href="/templates" class="menu-item active"><i class="fa-solid fa-dumbbell menu-icon"></i> Templates</a>
                <a href="/settings" class="menu-item"> <i class="fa-solid fa-gear menu-icon"></i> Settings</a>
            </nav>
        </div>
        <div class="sidebar-footer">
            <form method="post" th:action="@{/auth/logout}">
                <button type="submit" class="logout-link"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
            </form>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <div class="top-bar-left">
                <button class="menu-toggle" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
                <h1 class="page-title">My Templates</h1>
            </div>
            <a th:href="@{/templates/create}" class="btn-create-header">
                <i class="fa-solid fa-plus"></i> Create Template
            </a>
        </header>

        <div th:if="${#lists.isEmpty(templates)}" class="empty-state">
            <div class="empty-icon">
                <i class="fa-solid fa-clipboard-list"></i>
            </div>
            <h3>No templates yet</h3>
            <p class="text-muted">Create your first workout template to get started!</p>
        </div>

        <div th:if="${not #lists.isEmpty(templates)}" class="templates-grid">
            <div class="template-card" th:each="template : ${templates}">
                <div class="card-header">
                    <div class="header-left">
                        <div class="icon-box">
                            <i class="fa-solid fa-dumbbell"></i>
                        </div>
                        <h3 class="template-name" th:text="${template.name}">Template Name</h3>
                    </div>

                    <div class="card-actions dropdown">
                        <button class="btn-icon">
                            <i class="fa-solid fa-ellipsis-vertical"></i>
                        </button>

                        <div class="dropdown-content">
                            <a th:href="@{/templates/edit/{id}(id=${template.id})}" class="dropdown-item">
                                <i class="fa-solid fa-pen"></i> Edit
                            </a>

                            <button type="button"
                                    class="dropdown-item delete-item"
                                    th:data-url="@{/templates/delete/{id}(id=${template.id})}"
                                    onclick="openDeleteModal(this)">
                                <i class="fa-solid fa-trash"></i> Delete
                            </button>
                        </div>
                    </div>
                </div>

                <div class="card-body">
                    <p class="text-muted">Custom Workout Routine</p>
                </div>

                <div class="card-footer">
                    <a href="#" class="btn-start">Start Workout</a>
                </div>
            </div>
        </div>
    </main>
</div>

<div id="deleteModal" class="modal-overlay">
    <div class="modal-content"> <div class="modal-header">
        <h3>Confirm Delete</h3>
        <button class="close-modal-btn" onclick="closeDeleteModal()">&times;</button>
    </div>
        <div class="modal-body">
            <p>Are you sure you want to delete this template? This action cannot be undone.</p>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel-modal" onclick="closeDeleteModal()">Cancel</button>

            <form id="deleteForm" method="post" action="">
                <input type="hidden" name="_method" value="delete">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <button type="submit" class="btn-delete-confirm">Delete</button>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/js/menu-toggle.js}"></script>

<script>
    function openDeleteModal(button) {
        const deleteUrl = button.getAttribute('data-url');


        const form = document.getElementById('deleteForm');

        form.action = deleteUrl;


        document.getElementById('deleteModal').classList.add('active');
    }

    function closeDeleteModal() {
        document.getElementById('deleteModal').classList.remove('active');
    }

    document.getElementById('deleteModal').addEventListener('click', function (e) {
        if (e.target === this) {
            closeDeleteModal();
        }
    });
</script>

</body>
</html>
