<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link media="all" rel="stylesheet" th:href="@{/css/verify.css}" type="text/css"/>
    <title>Verify Email</title>
</head>
<body>

<div class="main-container">

    <form class="verify-form" th:action="@{/auth/verify}" method="post">

        <h1 class="form-title">Verify your email</h1>

        <div class="info-message">
            <p>We sent a code to <br> <b th:text="${param.email}">email@example.com</b></p>
        </div>

        <div class="error-message" th:if="${error}">
            <p th:text="${error}">Invalid code</p>
        </div>

        <input type="hidden" name="email" th:value="${param.email}">

        <div class="form-group">
            <label for="code" class="form-label" style="text-align: center;">Enter 6-digit code</label>

            <input type="text" id="code" name="code" class="form-input code-text"
                   placeholder="123456" maxlength="6" required
                   autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]*">
        </div>

        <button type="submit" class="submit-button">Confirm</button>

        <div class="auth-footer">
            <a th:href="@{/auth/register}">Back to registration</a>
        </div>
    </form>
</div>

</body>
</html>
