<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Workout</title>
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/workout-active.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="page-container">
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-content">
            <div class="logo">
                <h2>FitApp</h2>
                <button class="close-menu-btn" onclick="toggleMenu()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <nav class="menu">
                <a href="/dashboard" class="menu-item active"><i class="fa-solid fa-house menu-icon"></i> Dashboard</a>
                <a href="/templates" class="menu-item"><i class="fa-solid fa-dumbbell menu-icon"></i> Templates</a>
                <a href="/history" class="menu-item"><i class="fa-solid fa-clock-rotate-left menu-icon"></i> History</a>
                <a href="/settings" class="menu-item"><i class="fa-solid fa-gear menu-icon"></i> Settings</a>
            </nav>
        </div>
        <div class="sidebar-footer">
            <form method="post" th:action="@{/auth/logout}">
                <button type="submit" class="logout-link">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </form>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <button class="menu-toggle" onclick="toggleMenu()">
                <i class="fa-solid fa-bars"></i>
            </button>
        </header>

        <div class="workout-header">
            <div class="header-left">
                <h1 class="workout-title" th:text="${activeWorkout.templateName}">Workout</h1>
                <div class="timer-badge">
                    <i class="fa-regular fa-clock"></i>
                    <span th:text="${#temporals.format(activeWorkout.startedAt, 'dd MMM yyyy HH:mm')}">Start Time</span>
                </div>
            </div>
            <form th:action="@{/workouts/{id}/finish(id=${activeWorkout.sessionId})}" method="post">
                <button type="submit" class="btn-finish">
                    <i class="fa-solid fa-flag-checkered"></i> Finish Workout
                </button>
            </form>
        </div>

        <div th:if="${#lists.isEmpty(activeWorkout.exercises)}" class="empty-workout-state">
            <p>No exercises in this session.</p>
        </div>

        <div th:if="${!#lists.isEmpty(activeWorkout.exercises)}" class="workout-master-detail">
            <aside class="card exercise-sidebar" id="exerciseListPanel">
                <h2 class="card-title">Exercises</h2>
                <nav class="exercise-list">
                    <button type="button"
                            class="exercise-item-card"
                            th:classappend="${exerciseStat.index == 0} ? ' active' : ''"
                            th:each="exercise, exerciseStat : ${activeWorkout.exercises}"
                            th:attr="onclick=|selectExercise(${exercise.id})|,data-exercise-id=${exercise.id}">
                        <span class="exercise-item-name" th:text="${exercise.exerciseName}">Exercise name</span>
                        <span class="exercise-item-muscle" th:text="${exercise.muscleGroup}">Muscle group</span>
                    </button>
                </nav>
            </aside>

            <section class="card exercise-main" id="exerciseDetailPanel">
                <button type="button" class="btn-back-list" onclick="showExerciseList()">
                    <i class="fa-solid fa-arrow-left"></i> Back to list
                </button>
                <div th:each="exercise, exerciseStat : ${activeWorkout.exercises}"
                     class="exercise-detail"
                     th:attr="data-exercise-id=${exercise.id}"
                     th:style="${exerciseStat.index == 0} ? 'display: block;' : 'display: none;'">
                    <div class="exercise-card">
                        <div class="exercise-header">
                            <h2 class="exercise-name" th:text="${exercise.exerciseName}">Exercise name</h2>
                            <span class="timer-badge" th:text="${exercise.muscleGroup}">Muscle group</span>
                        </div>
                        <div class="sets-table-wrapper">
                            <table class="sets-table">
                                <thead>
                                <tr>
                                    <th>Set #</th>
                                    <th>Weight</th>
                                    <th>Reps</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="set : ${exercise.sets}">
                                    <td th:text="${set.setNumber}">1</td>
                                    <td th:text="${set.weight}">0</td>
                                    <td th:text="${set.reps}">0</td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(exercise.sets)}">
                                    <td colspan="3">No sets logged yet.</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>

                        <form th:action="@{/workouts/set/add}" method="post" th:object="${addSetDto}">
                            <input type="hidden" name="sessionId" th:value="${activeWorkout.sessionId}">
                            <input type="hidden" name="sessionExerciseId" th:value="${exercise.id}">
                            <div class="form-errors"
                                 th:if="${#fields.hasAnyErrors() and addSetDto.sessionExerciseId == exercise.id}">
                                <p th:each="error : ${#fields.errors('*')}" th:text="${error}">Validation error</p>
                            </div>
                            <table class="sets-table">
                                <tbody>
                                <tr>
                                    <td><span class="set-badge">New</span></td>
                                    <td><input class="input-stat" type="number" step="0.01" min="0.01" max="9999.99" maxlength="7" th:field="*{weight}" placeholder="kg" required></td>
                                    <td><input class="input-stat" type="number" min="1" max="999" th:field="*{reps}" placeholder="reps" required></td>
                                    <td><input class="input-stat" type="number" min="0" th:field="*{restSeconds}" placeholder="sec" required></td>
                                    <td>
                                        <select class="input-stat" th:field="*{setType}">
                                            <option th:each="setType : ${setTypes}" th:value="${setType}" th:text="${setType}">NORMAL</option>
                                        </select>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                            <button type="submit" class="btn-add-set">
                                <i class="fa-solid fa-plus"></i> Add Set
                            </button>
                        </form>
                    </div>
                </div>
            </section>
        </div>
    </main>
</div>

<script th:src="@{/js/menu-toggle.js}"></script>
<script th:inline="javascript">
    function selectExercise(exerciseId) {
        document.getElementById('exerciseListPanel').classList.remove('hidden-mobile');
        document.getElementById('exerciseDetailPanel').classList.remove('hidden-mobile');
        document.querySelectorAll('.exercise-detail').forEach(function (detail) {
            detail.style.display = detail.dataset.exerciseId === String(exerciseId) ? 'block' : 'none';
        });

        document.querySelectorAll('[data-exercise-id].exercise-item-card').forEach(function (item) {
            item.classList.toggle('active', item.dataset.exerciseId === String(exerciseId));
        });

        if (window.matchMedia('(max-width: 768px)').matches) {
            document.getElementById('exerciseListPanel').classList.add('hidden-mobile');
        }
    }

    function showExerciseList() {
        document.getElementById('exerciseListPanel').classList.remove('hidden-mobile');
    }

    document.addEventListener('DOMContentLoaded', function () {
        const selectedFromModel = /*[[${addSetDto.sessionExerciseId}]]*/ null;
        if (selectedFromModel) {
            selectExercise(selectedFromModel);
            return;
        }
        const firstExercise = document.querySelector('[data-exercise-id].exercise-item-card');
        if (firstExercise && firstExercise.dataset.exerciseId) {
            selectExercise(firstExercise.dataset.exerciseId);
        }
    });
</script>
</body>
</html>
