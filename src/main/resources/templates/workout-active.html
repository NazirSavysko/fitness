<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Workout</title>
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/workout-active.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .menu-item.workout-nav-locked {
            pointer-events: none;
            opacity: 0.5;
            cursor: default;
        }
    </style>
</head>
<body>
<div class="page-container">
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-content">
            <div class="logo">
                <h2>FitApp</h2>
                <button class="close-menu-btn" onclick="toggleMenu()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <nav class="menu">
                <a href="/dashboard" class="menu-item active"><i class="fa-solid fa-house menu-icon"></i> Dashboard</a>
                <a href="/templates" class="menu-item"><i class="fa-solid fa-dumbbell menu-icon"></i> Templates</a>
                <a href="/history" class="menu-item"><i class="fa-solid fa-clock-rotate-left menu-icon"></i> History</a>
                <a href="/settings" class="menu-item"><i class="fa-solid fa-gear menu-icon"></i> Settings</a>
            </nav>
        </div>
        <div class="sidebar-footer">
            <form method="post" th:action="@{/auth/logout}">
                <button type="submit" class="logout-link">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </form>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <button class="menu-toggle" onclick="toggleMenu()">
                <i class="fa-solid fa-bars"></i>
            </button>
        </header>

        <div class="workout-header">
            <div class="header-left">
                <h1 class="workout-title" th:text="${activeWorkout.templateName}">Workout</h1>
                <div class="timer-badge">
                    <i class="fa-regular fa-clock"></i>
                    <span th:text="${#temporals.format(activeWorkout.startedAt, 'dd MMM yyyy HH:mm')}">Start Time</span>
                </div>
            </div>
            <form id="finish-workout-form" th:action="@{/workouts/{id}/finish(id=${activeWorkout.sessionId})}" method="post">
                <button type="submit" class="btn-finish">
                    <i class="fa-solid fa-flag-checkered"></i> Finish Workout
                </button>
            </form>
        </div>

        <div th:if="${#lists.isEmpty(activeWorkout.exercises)}" class="empty-workout-state">
            <p>No exercises in this session.</p>
        </div>

        <div th:if="${!#lists.isEmpty(activeWorkout.exercises)}">
            <div th:each="exercise : ${activeWorkout.exercises}" class="exercise-card">
                <div class="exercise-header">
                    <h2 class="exercise-name" th:text="${exercise.exerciseName}">Exercise name</h2>
                    <span class="timer-badge" th:text="${exercise.muscleGroup}">Muscle group</span>
                </div>
                <div class="sets-table-wrapper">
                    <table class="sets-table">
                        <thead>
                        <tr>
                            <th>Set #</th>
                            <th>Weight</th>
                            <th>Reps</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="set : ${exercise.sets}">
                            <td th:text="${set.setNumber}">1</td>
                            <td th:text="${set.weight}">0</td>
                            <td th:text="${set.reps}">0</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(exercise.sets)}">
                            <td colspan="3">No sets logged yet.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <form class="add-set-form" th:action="@{/workouts/set/add}" method="post">
                    <input type="hidden" name="sessionId" th:value="${activeWorkout.sessionId}">
                    <input type="hidden" name="sessionExerciseId" th:value="${exercise.id}">
                    <table class="sets-table">
                        <tbody>
                        <tr>
                            <td><span class="set-badge">New</span></td>
                            <td><input class="input-stat" type="number" step="any" min="0" name="weight" placeholder="kg" required></td>
                            <td><input class="input-stat" type="number" min="0" name="reps" placeholder="reps" required></td>
                            <td><input class="input-stat" type="number" min="0" name="restSeconds" placeholder="sec" required></td>
                            <td>
                                <select class="input-stat" name="setType">
                                    <option th:each="setType : ${setTypes}" th:value="${setType}" th:text="${setType}">NORMAL</option>
                                </select>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <button type="submit" class="btn-add-set">
                        <i class="fa-solid fa-plus"></i> Add Set
                    </button>
                </form>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/menu-toggle.js}"></script>
<script>
    let isSubmitting = false;

    document.addEventListener('DOMContentLoaded', function () {
        const savedScrollPos = sessionStorage.getItem('workoutScrollPos');
        if (savedScrollPos !== null) {
            window.scrollTo(0, parseInt(savedScrollPos, 10));
            sessionStorage.removeItem('workoutScrollPos');
        }

        document.querySelectorAll('form').forEach(function (form) {
            form.addEventListener('submit', function () {
                isSubmitting = true;
            });
        });

        document.querySelectorAll('.add-set-form').forEach(function (form) {
            form.addEventListener('submit', function () {
                sessionStorage.setItem('workoutScrollPos', String(window.scrollY));
            });
        });

        document.querySelectorAll('a.menu-item').forEach(function (menuLink) {
            menuLink.classList.add('workout-nav-locked');
            menuLink.addEventListener('click', function (e) {
                e.preventDefault();
            });
        });
    });

    window.addEventListener('beforeunload', function (e) {
        if (isSubmitting) {
            return;
        }
        e.preventDefault();
        e.returnValue = '';
    });
</script>
</body>
</html>
