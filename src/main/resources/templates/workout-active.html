<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Workout</title>
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/workout-active.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div class="page-container">

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-content">
            <div class="logo">
                <h2>FitApp</h2>
                <button class="close-menu-btn" onclick="toggleMenu()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <nav class="menu">
                <a href="/dashboard" class="menu-item active"><i class="fa-solid fa-house menu-icon"></i> Dashboard</a>
                <a href="/templates" class="menu-item"><i class="fa-solid fa-dumbbell menu-icon"></i> Templates</a>
                <a href="/settings" class="menu-item"> <i class="fa-solid fa-gear menu-icon"></i> Settings</a>
            </nav>
        </div>
    </aside>

    <main class="main-content">
        <header class="workout-header">
            <div class="header-left">
                <h1 class="workout-title" th:text="${session.name}">Workout Name</h1>

                <div class="timer-badge">
                    <i class="fa-regular fa-clock"></i>
                    <span id="workoutTimer">00:00</span>
                </div>
            </div>
            <form th:action="@{/workout/finish}" method="post" style="margin: 0;">
                <input type="hidden" name="sessionId" th:value="${session.id}">
                <button type="submit" class="btn-finish">Finish</button>
            </form>
        </header>

        <div class="workout-container">
            <!-- Sidebar: Exercise List -->
            <aside class="exercise-list-panel">
                <div class="list-header">
                    <h3>Exercises</h3>
                </div>
                <ul class="exercise-list">
                    <li th:each="ex : ${session.exercises}"
                        class="exercise-item"
                        th:id="'list-item-' + ${ex.exerciseId}"
                        th:onclick="'selectExercise(' + ${ex.exerciseId} + ')'">
                        <span class="exercise-name" th:text="${ex.exerciseName}">Exercise</span>
                        <span class="set-count" th:id="'count-' + ${ex.exerciseId}" th:text="${ex.sets.size()} + ' sets'">0 sets</span>
                    </li>
                    <li th:if="${#lists.isEmpty(session.exercises)}" class="exercise-item placeholder">
                        <span class="exercise-name">No exercises yet</span>
                    </li>
                </ul>
            </aside>

            <!-- Detail panel -->
            <section class="exercise-detail-panel">
                <div class="detail-shell">
                    <div id="empty-state" class="empty-state" th:if="${#lists.isEmpty(session.exercises)}">
                        <i class="fa-solid fa-dumbbell"></i>
                        <p>No exercises in this workout yet</p>
                    </div>
                    <div id="empty-state-select" class="empty-state" th:if="${!#lists.isEmpty(session.exercises)}">
                        <i class="fa-solid fa-dumbbell"></i>
                        <p>Select an exercise to start logging sets</p>
                    </div>

                    <div th:each="ex : ${session.exercises}"
                         th:id="'detail-' + ${ex.exerciseId}"
                         class="detail-content"
                         style="display: none;">
                        <div class="detail-header">
                            <h2 th:text="${ex.exerciseName}">Exercise</h2>
                        </div>
                        <table class="sets-table" th:id="'table-' + ${ex.exerciseId}">
                            <thead>
                            <tr>
                                <th>Set</th>
                                <th>Weight (kg)</th>
                                <th>Reps</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="set : ${ex.sets}">
                                <td th:text="${set.setNumber}">1</td>
                                <td th:text="${set.weight}">0</td>
                                <td th:text="${set.reps}">0</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>
</div>

<script th:src="@{/js/menu-toggle.js}"></script>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const timerElement = document.getElementById('workoutTimer');
        let seconds = 0;
        setInterval(() => {
            seconds++;
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            timerElement.textContent = `${m}:${s}`;
        }, 1000);

        const firstItem = document.querySelector('.exercise-item:not(.placeholder)');
        if (firstItem) {
            firstItem.click();
            const selectMsg = document.getElementById('empty-state-select');
            if (selectMsg) selectMsg.style.display = 'none';
        }
    });

    function selectExercise(exerciseId) {
        const selectState = document.getElementById('empty-state-select');
        if (selectState) selectState.style.display = 'none';

        document.querySelectorAll('.detail-content').forEach(el => el.style.display = 'none');
        const detail = document.getElementById('detail-' + exerciseId);
        if (detail) detail.style.display = 'block';

        document.querySelectorAll('.exercise-item').forEach(el => el.classList.remove('active'));
        const item = document.getElementById('list-item-' + exerciseId);
        if (item) item.classList.add('active');
    }
</script>

</body>
</html>
