<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Template</title>

    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/create-template.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>
<body>

<div class="page-container">
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-content">
            <div class="logo">
                <h2>FitApp</h2>
                <button class="close-menu-btn" onclick="toggleMenu()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <nav class="menu">
                <a href="/dashboard" class="menu-item"><i class="fa-solid fa-house menu-icon"></i> Dashboard</a>
                <a href="/templates" class="menu-item active"><i class="fa-solid fa-dumbbell menu-icon"></i> Templates</a>
                <a href="/history" class="menu-item"><i class="fa-solid fa-clock-rotate-left menu-icon"></i> History</a>
                <a href="/settings" class="menu-item"> <i class="fa-solid fa-gear menu-icon"></i> Settings</a>
            </nav>
        </div>
        <div class="sidebar-footer">
            <form method="post" th:action="@{/auth/logout}">
                <button type="submit" class="logout-link"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
            </form>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <div class="top-bar-left">
                <button class="menu-toggle" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
                <div class="breadcrumbs">
                    <a href="/templates" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back</a>
                    <h1 class="page-title">Update Template</h1>
                </div>
            </div>
        </header>

        <form class="create-form-grid"
              th:action="@{/templates/edit}"
              method="post"
              th:object="${UpdateTemplateDto}"
              data-template-submit="true">

            <input type="hidden" th:field="*{id}"/>

            <div class="card">
                <h3 class="card-title">Basic Information</h3>
                <div class="form-group">
                    <label class="form-label">Template Name</label>
                    <input type="text"
                           class="form-input"
                           th:field="*{name}"
                           th:classappend="${#fields.hasErrors('name')} ? 'field-error' : ''"
                           placeholder="e.g., Upper Body Power">
                    <div class="field-error-text" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>
            </div>

            <div class="card">
                <h3 class="card-title">Exercises</h3>
                <p class="text-muted">Modify exercises in your workout template.</p>

                <div id="exercises-container">
                    <div class="exercise-row" th:each="ex, stat : *{exercises}">
                        <span class="drag-handle"><i class="fa-solid fa-grip-lines"></i></span>

                        <div class="form-group mb-0 flex-grow">
                            <select class="form-input exercise-select" th:field="*{exercises[__${stat.index}__].exerciseId}">
                                <option value="" disabled>Select Exercise</option>
                                <option th:each="opt : ${exercises}"
                                        th:value="${opt.exerciseId}"
                                        th:text="${opt.exerciseName + ' (' + opt.muscleGroup + ')'}">
                                    Option
                                </option>
                            </select>
                        </div>

                        <div class="form-group mb-0">
                            <input class="form-input" type="number" min="0" th:field="*{exercises[__${stat.index}__].normalSets}" placeholder="Normal Sets">
                        </div>

                        <div class="form-group mb-0">
                            <input class="form-input" type="number" min="0" th:field="*{exercises[__${stat.index}__].failureSets}" placeholder="Failure Sets">
                        </div>

                        <div class="form-group mb-0">
                            <input class="form-input" type="number" min="0" th:field="*{exercises[__${stat.index}__].restSeconds}" placeholder="Rest (sec)">
                        </div>

                        <button type="button" class="btn-remove-exercise" onclick="removeExerciseRow(this)">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>

                <div class="field-error-text" th:if="${#fields.hasErrors('exercises')}" th:errors="*{exercises}"></div>

                <button type="button" class="btn-add-exercise" onclick="addExerciseRow()">
                    <i class="fa-solid fa-plus"></i> Add Exercise
                </button>
            </div>

            <div class="form-actions">
                <a th:href="@{/templates}" class="btn-cancel">Cancel</a>
                <button type="submit" class="btn-primary btn-save">Save Template</button>
            </div>
        </form>
    </main>
</div>

<template id="exercise-row-template">
    <div class="exercise-row">
        <span class="drag-handle"><i class="fa-solid fa-grip-lines"></i></span>

        <div class="form-group mb-0 flex-grow">
            <select class="form-input exercise-select" name="exercises[INDEX].exerciseId">
                <option value="" disabled selected>Select Exercise</option>

                <option th:each="exercise : ${exercises}"
                        th:value="${exercise?.exerciseId}"
                        th:text="${exercise?.exerciseName + ' (' + exercise?.muscleGroup + ')'}">
                    Exercise Name
                </option>
            </select>
        </div>

        <div class="form-group mb-0">
            <input class="form-input" type="number" min="0" name="exercises[INDEX].normalSets" value="0" placeholder="Normal Sets">
        </div>

        <div class="form-group mb-0">
            <input class="form-input" type="number" min="0" name="exercises[INDEX].failureSets" value="0" placeholder="Failure Sets">
        </div>

        <div class="form-group mb-0">
            <input class="form-input" type="number" min="0" name="exercises[INDEX].restSeconds" value="60" placeholder="Rest (sec)">
        </div>

        <button type="button" class="btn-remove-exercise" onclick="removeExerciseRow(this)">
            <i class="fa-solid fa-trash"></i>
        </button>
    </div>
</template>

<script th:src="@{/js/menu-toggle.js}"></script>
<script>
    const TEMPLATE_SCROLL_KEY = 'templateScrollPos';
    let isSubmittingTemplate = false;
    let exerciseIndex = document.querySelectorAll('#exercises-container .exercise-row').length;

    function addExerciseRow() {
        const currentScrollPos = window.scrollY;
        sessionStorage.setItem(TEMPLATE_SCROLL_KEY, String(currentScrollPos));

        const container = document.getElementById('exercises-container');
        const template = document.getElementById('exercise-row-template');

        // Клонируем шаблон
        const clone = template.content.cloneNode(true);

        clone.querySelectorAll('[name]').forEach((field) => {
            field.name = field.name.replaceAll('INDEX', exerciseIndex);
        });

        container.appendChild(clone);
        exerciseIndex++;
        window.scrollTo(0, currentScrollPos);
    }

    function removeExerciseRow(btn) {
        const currentScrollPos = window.scrollY;
        sessionStorage.setItem(TEMPLATE_SCROLL_KEY, String(currentScrollPos));
        btn.closest('.exercise-row').remove();
        window.scrollTo(0, currentScrollPos);
    }

    document.addEventListener('DOMContentLoaded', function () {
        const savedScrollPos = sessionStorage.getItem(TEMPLATE_SCROLL_KEY);
        if (savedScrollPos !== null) {
            window.scrollTo(0, parseInt(savedScrollPos, 10));
            sessionStorage.removeItem(TEMPLATE_SCROLL_KEY);
        }

        document.querySelectorAll('a.menu-item').forEach(function (menuLink) {
            menuLink.classList.add('template-nav-locked');
            menuLink.setAttribute('aria-disabled', 'true');
            menuLink.addEventListener('click', function (e) {
                e.preventDefault();
            });
            menuLink.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                }
            });
        });

        document.querySelectorAll('form').forEach(function (form) {
            form.addEventListener('submit', function () {
                if (form.dataset.templateSubmit === 'true') {
                    isSubmittingTemplate = true;
                }
            });
        });

    });

    window.addEventListener('beforeunload', function (e) {
        if (isSubmittingTemplate) {
            return;
        }
        e.preventDefault();
        e.returnValue = '';
    });
</script>

</body>
</html>
