<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Workout</title>
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/workout-active.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .menu-item.workout-nav-locked {
            pointer-events: none;
            opacity: 0.5;
            cursor: default;
        }
    </style>
</head>
<body>
<div class="page-container">
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-content">
            <div class="logo">
                <h2>FitApp</h2>
                <button class="close-menu-btn" onclick="toggleMenu()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <nav class="menu">
                <a href="/dashboard" class="menu-item active"><i class="fa-solid fa-house menu-icon"></i> Dashboard</a>
                <a href="/templates" class="menu-item"><i class="fa-solid fa-dumbbell menu-icon"></i> Templates</a>
                <a href="/history" class="menu-item"><i class="fa-solid fa-clock-rotate-left menu-icon"></i> History</a>
                <a href="/settings" class="menu-item"><i class="fa-solid fa-gear menu-icon"></i> Settings</a>
            </nav>
        </div>
        <div class="sidebar-footer">
            <form method="post" th:action="@{/auth/logout}">
                <button type="submit" class="logout-link">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </form>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <button class="menu-toggle" onclick="toggleMenu()">
                <i class="fa-solid fa-bars"></i>
            </button>
        </header>

        <div class="workout-header">
            <div class="header-left">
                <h1 class="workout-title" th:text="${activeWorkout.templateName}">Workout</h1>
                <div class="timer-badge">
                    <i class="fa-regular fa-clock"></i>
                    <span th:text="${#temporals.format(activeWorkout.startedAt, 'dd MMM yyyy HH:mm')}">Start Time</span>
                </div>
            </div>
            <form id="finish-workout-form"
                  th:action="@{/workouts/{id}/finish(id=${activeWorkout.sessionId})}"
                  th:attr="data-bulk-update-url=@{/workouts/bulk-update-sets},data-csrf-token=${_csrf.token},data-csrf-header=${_csrf.headerName}"
                  method="post">
                <button type="submit" class="btn-finish">
                    <i class="fa-solid fa-flag-checkered"></i> Finish Workout
                </button>
            </form>
        </div>

        <div th:if="${#lists.isEmpty(activeWorkout.exercises)}" class="empty-workout-state">
            <p>No exercises in this session.</p>
        </div>

        <div class="active-workout-grid" th:if="${!#lists.isEmpty(activeWorkout.exercises)}">
            <div class="exercises-sidebar">
                <h3 class="sidebar-header">Exercises</h3>
                <div class="exercise-nav-list">
                    <div th:each="exercise, iterStat : ${activeWorkout.exercises}"
                         class="exercise-nav-list"
                         th:onclick="'switchTab(' + ${iterStat.index} + ')'"
                         th:id="'nav-item-' + ${iterStat.index}"
                         th:classappend="${iterStat.index == 0} ? 'active'">
                        <div class="nav-item-title" th:text="${exercise.exerciseName}">Exercise Name</div>
                        <div class="nav-item-muscle" th:text="${exercise.muscleGroup}">Muscle Group</div>
                    </div>
                </div>
            </div>

            <div class="exercise-detail-container">
                <div th:each="exercise, iterStat : ${activeWorkout.exercises}"
                     class="exercise-tab-content"
                     th:id="'tab-content-' + ${iterStat.index}"
                     th:style="${iterStat.index == 0} ? '' : 'display: none;'">

                    <div class="detail-header">
                        <h2 class="detail-title" th:text="${exercise.exerciseName}">Hammer Curl</h2>
                        <span class="muscle-badge" th:text="${exercise.muscleGroup}">Biceps</span>
                    </div>

                    <div class="sets-list-header">
                        <div>Set #</div>
                        <div>Weight (kg)</div>
                        <div>Reps</div>
                        <div>Rest (s)</div>
                        <div>Type</div>
                    </div>

                    <div class="sets-list">
                        <div th:each="set : ${exercise.sets}"
                             class="set-row"
                             th:attr="data-set-id=${set.id}">
                            <div class="set-number" th:text="${set.setNumber}">1</div>

                            <div>
                                <input type="number" step="any" min="0" name="weight"
                                       class="form-input set-value-input set-weight-input"
                                       th:value="${set.weight != null ? set.weight : '0'}"
                                       placeholder="0.0"
                                       th:attr="aria-label='Weight for set ' + ${set.setNumber}">
                            </div>

                            <div>
                                <input type="number" min="0" name="reps"
                                       class="form-input set-value-input set-reps-input"
                                       th:value="${set.reps != null ? set.reps : '0'}"
                                       placeholder="0"
                                       th:attr="aria-label='Reps for set ' + ${set.setNumber}">
                            </div>

                            <div>
                                <input type="number" min="0" name="restSeconds"
                                       class="form-input set-value-input set-rest-input"
                                       th:value="${set.restSeconds != null ? set.restSeconds : '0'}"
                                       placeholder="0"
                                       th:attr="aria-label='Rest seconds for set ' + ${set.setNumber}">
                            </div>

                            <div>
                                <span class="set-badge"
                                      th:classappend="${set.setType != null ? set.setType.name().toLowerCase() + '-badge' : ''}"
                                      th:text="${set.setType}">NORMAL</span>
                            </div>
                        </div>
                        <div th:if="${#lists.isEmpty(exercise.sets)}" style="padding: 20px; text-align: center; color: #A3AED0;">
                            No sets logged yet.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/menu-toggle.js}"></script>
<script>
    let isSubmitting = false;

    function switchTab(index) {
        // Update Sidebar
        document.querySelectorAll('.exercise-nav-item').forEach(item => item.classList.remove('active'));
        const navItem = document.getElementById('nav-item-' + index);
        if (navItem) navItem.classList.add('active');

        // Update Content
        document.querySelectorAll('.exercise-tab-content').forEach(content => content.style.display = 'none');
        const tabContent = document.getElementById('tab-content-' + index);
        if (tabContent) tabContent.style.display = 'block';

        // Save state
        sessionStorage.setItem('activeExerciseIndex', index);
    }

    document.addEventListener('DOMContentLoaded', function () {
        const finishWorkoutForm = document.getElementById('finish-workout-form');
        const activeIndex = sessionStorage.getItem('activeExerciseIndex');
        if (activeIndex) {
            switchTab(activeIndex);
        }

        const savedScrollPos = sessionStorage.getItem('workoutScrollPos');
        if (savedScrollPos !== null) {
            window.scrollTo(0, parseInt(savedScrollPos, 10));
            sessionStorage.removeItem('workoutScrollPos');
        }

        document.querySelectorAll('form').forEach(function (form) {
            form.addEventListener('submit', function () {
                if (form.id === 'finish-workout-form') {
                    return;
                }
                isSubmitting = true;
                if (form.dataset.scrollSave === 'true') {
                    sessionStorage.setItem('workoutScrollPos', String(window.scrollY));
                }
            });
        });

        if (finishWorkoutForm) {
            finishWorkoutForm.addEventListener('submit', async function (e) {
                e.preventDefault();
                if (isSubmitting) {
                    return;
                }
                isSubmitting = true;

                const bulkUpdateUrl = finishWorkoutForm.dataset.bulkUpdateUrl;
                const headers = {'Content-Type': 'application/json'};
                const csrfTokenFromData = finishWorkoutForm.dataset.csrfToken;
                const csrfHeaderName = finishWorkoutForm.dataset.csrfHeader || 'X-XSRF-TOKEN';
                const csrfCookieMatch = document.cookie.match(/(?:^|;\s*)XSRF-TOKEN=([^;]+)/);
                const csrfTokenFromCookie = csrfCookieMatch ? decodeURIComponent(csrfCookieMatch[1]) : null;
                const csrfToken = csrfTokenFromData || csrfTokenFromCookie || null;
                if (csrfToken) {
                    headers[csrfHeaderName] = csrfToken;
                }

                const parseInputValueToNumberOrNull = (value) => {
                    const normalizedValue = value == null ? '' : value.trim();
                    if (normalizedValue === '') {
                        return null;
                    }
                    const parsed = Number(normalizedValue);
                    return Number.isFinite(parsed) ? parsed : null;
                };
                const payload = Array.from(document.querySelectorAll('.set-row[data-set-id]')).map(function (row) {
                    const weightInput = row.querySelector('.set-weight-input');
                    const repsInput = row.querySelector('.set-reps-input');
                    const restInput = row.querySelector('.set-rest-input');
                    return {
                        setId: Number(row.dataset.setId),
                        weight: parseInputValueToNumberOrNull(weightInput ? weightInput.value : ''),
                        reps: parseInputValueToNumberOrNull(repsInput ? repsInput.value : ''),
                        restSeconds: parseInputValueToNumberOrNull(restInput ? restInput.value : '')
                    };
                });

                try {
                    const response = await fetch(bulkUpdateUrl, {
                        method: 'POST',
                        headers: headers,
                        credentials: 'same-origin',
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        throw new Error(`Bulk update failed with status ${response.status} ${response.statusText}`);
                    }

                    HTMLFormElement.prototype.submit.call(finishWorkoutForm);
                } catch (error) {
                    isSubmitting = false;
                    window.alert(`Unable to save set values before finishing workout (${error.message}). Please check inputs or your connection and try again.`);
                    console.error(error);
                }
            });
        }

        document.querySelectorAll('a.menu-item').forEach(function (menuLink) {
            menuLink.classList.add('workout-nav-locked');
            menuLink.addEventListener('click', function (e) {
                e.preventDefault();
            });
            menuLink.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                }
            });
        });
        window.addEventListener('beforeunload', function (e) {
            if (isSubmitting) {
                return;
            }
            e.preventDefault();
            e.returnValue = '';
        });
    });
</script>
</body>
</html>
