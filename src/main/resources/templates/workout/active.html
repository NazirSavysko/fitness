<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Workout</title>
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/workout-active.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .menu-item.workout-nav-locked {
            pointer-events: none;
            opacity: 0.5;
            cursor: default;
        }
    </style>
</head>
<body>
<div class="page-container">
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-content">
            <div class="logo">
                <h2>FitApp</h2>
                <button class="close-menu-btn" onclick="toggleMenu()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <nav class="menu">
                <a href="/dashboard" class="menu-item active"><i class="fa-solid fa-house menu-icon"></i> Dashboard</a>
                <a href="/templates" class="menu-item"><i class="fa-solid fa-dumbbell menu-icon"></i> Templates</a>
                <a href="/history" class="menu-item"><i class="fa-solid fa-clock-rotate-left menu-icon"></i> History</a>
                <a href="/settings" class="menu-item"><i class="fa-solid fa-gear menu-icon"></i> Settings</a>
            </nav>
        </div>
        <div class="sidebar-footer">
            <form method="post" th:action="@{/auth/logout}">
                <button type="submit" class="logout-link">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </form>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <button class="menu-toggle" onclick="toggleMenu()">
                <i class="fa-solid fa-bars"></i>
            </button>
        </header>

        <div class="workout-header">
            <div class="header-left">
                <h1 class="workout-title" th:text="${activeWorkout.templateName}">Workout</h1>
                <div class="timer-badge">
                    <i class="fa-regular fa-clock"></i>
                    <span th:text="${#temporals.format(activeWorkout.startedAt, 'dd MMM yyyy HH:mm')}">Start Time</span>
                </div>
            </div>
            <form id="finish-workout-form" th:action="@{/workouts/{id}/finish(id=${activeWorkout.sessionId})}" method="post">
                <button type="submit" class="btn-finish">
                    <i class="fa-solid fa-flag-checkered"></i> Finish Workout
                </button>
            </form>
        </div>

        <div th:if="${#lists.isEmpty(activeWorkout.exercises)}" class="empty-workout-state">
            <p>No exercises in this session.</p>
        </div>

        <div class="active-workout-grid" th:if="${!#lists.isEmpty(activeWorkout.exercises)}">
            <!-- Sidebar -->
            <div class="exercises-sidebar">
                <h3 class="sidebar-header">Exercises</h3>
                <div class="exercise-nav-list">
                    <div th:each="exercise, iterStat : ${activeWorkout.exercises}"
                         class="exercise-nav-item"
                         th:onclick="'switchTab(' + ${iterStat.index} + ')'"
                         th:id="'nav-item-' + ${iterStat.index}"
                         th:classappend="${iterStat.index == 0} ? 'active'">
                        <div class="nav-item-title" th:text="${exercise.exerciseName}">Exercise Name</div>
                        <div class="nav-item-muscle" th:text="${exercise.muscleGroup}">Muscle Group</div>
                    </div>
                </div>
            </div>

            <!-- Details Panel -->
            <div class="exercise-detail-container">
                <div th:each="exercise, iterStat : ${activeWorkout.exercises}"
                     class="exercise-tab-content"
                     th:id="'tab-content-' + ${iterStat.index}"
                     th:style="${iterStat.index == 0} ? '' : 'display: none;'">

                    <div class="detail-header">
                        <h2 class="detail-title" th:text="${exercise.exerciseName}">Hammer Curl</h2>
                        <span class="muscle-badge" th:text="${exercise.muscleGroup}">Biceps</span>
                    </div>

                    <div class="sets-list-header">
                        <div>Set #</div>
                        <div>Weight (kg)</div>
                        <div>Reps</div>
                        <div>Rest (s)</div>
                        <div>Type</div>
                        <div>Action</div>
                    </div>

                    <div class="sets-list">
                        <form th:each="set : ${exercise.sets}"
                              class="set-row"
                              data-scroll-save="true"
                              data-rest-form="true"
                              th:with="defaultRestSeconds=60"
                              th:action="@{/workouts/set/update}"
                              method="post">
                            <input type="hidden" name="sessionId" th:value="${activeWorkout.sessionId}">
                            <input type="hidden" name="setId" th:value="${set.id}">
                            <input type="hidden" class="rest-seconds-value" th:value="${set.restSeconds == null ? defaultRestSeconds : set.restSeconds}">

                            <div class="set-number" th:text="${set.setNumber}">1</div>
                            <div><input type="number" step="any" min="0" name="weight" class="form-input" th:value="${set.weight}" placeholder="0.0" required></div>
                            <div><input type="number" min="0" name="reps" class="form-input" th:value="${set.reps}" placeholder="0" required></div>
                            <div th:text="${set.restSeconds}">60</div>
                            <div>
                                <span class="set-badge"
                                      th:classappend="${set.setType != null ? set.setType.name().toLowerCase() + '-badge' : ''}"
                                      th:text="${set.setType}">NORMAL</span>
                            </div>
                            <div>
                                <button type="submit" class="btn-add-set-large">Log/Update</button>
                            </div>
                        </form>
                        <div th:if="${#lists.isEmpty(exercise.sets)}" style="padding: 20px; text-align: center; color: #A3AED0;">
                            No sets logged yet.
                        </div>
                    </div>

                    <div class="add-set-section">
                        <form class="add-set-form" data-scroll-save="true" th:action="@{/workouts/set/add}" method="post">
                            <input type="hidden" name="sessionId" th:value="${activeWorkout.sessionId}">
                            <input type="hidden" name="sessionExerciseId" th:value="${exercise.id}">
                            <input type="hidden" name="setType" value="NORMAL">

                            <div class="form-grid">
                                <div class="form-group">
                                    <label class="form-label">Weight (kg)</label>
                                    <input type="number" step="any" min="0" name="weight" class="form-input" placeholder="0.0" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Reps</label>
                                    <input type="number" min="0" name="reps" class="form-input" placeholder="0" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Rest (sec)</label>
                                    <input type="number" min="0" name="restSeconds" class="form-input" value="60" required>
                                </div>
                            </div>

                            <button type="submit" class="btn-add-set-large">
                                <i class="fa-solid fa-plus"></i> Add Extra Set
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<div id="global-rest-timer" style="display:none;position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;padding:12px 16px;border-radius:12px;z-index:1000;box-shadow:0 8px 24px rgba(0,0,0,0.25);">
    <div style="font-size:12px;opacity:0.75;">Rest timer</div>
    <div id="global-rest-timer-value" style="font-size:24px;font-weight:700;">00:00</div>
</div>

<script th:src="@{/js/menu-toggle.js}"></script>
<script>
    const REST_BEEP_FREQUENCY_HZ = 880;
    const REST_BEEP_DURATION_SECONDS = 0.2;
    const REST_BEEP_GAIN = 0.1;
    let isSubmitting = false;
    let restTimerInterval = null;
    let hasBeeped = false;

    function switchTab(index) {
        // Update Sidebar
        document.querySelectorAll('.exercise-nav-item').forEach(item => item.classList.remove('active'));
        const navItem = document.getElementById('nav-item-' + index);
        if (navItem) navItem.classList.add('active');

        // Update Content
        document.querySelectorAll('.exercise-tab-content').forEach(content => content.style.display = 'none');
        const tabContent = document.getElementById('tab-content-' + index);
        if (tabContent) tabContent.style.display = 'block';

        // Save state
        sessionStorage.setItem('activeExerciseIndex', index);
    }

    document.addEventListener('DOMContentLoaded', function () {
        const restTimerWidget = document.getElementById('global-rest-timer');
        const restTimerValue = document.getElementById('global-rest-timer-value');

        function formatTime(totalSeconds) {
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function playBeep() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.value = REST_BEEP_FREQUENCY_HZ;
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                gainNode.gain.value = REST_BEEP_GAIN;
                oscillator.start();
                oscillator.stop(audioContext.currentTime + REST_BEEP_DURATION_SECONDS);
            } catch (e) {
                // no-op for unsupported browsers
            }
        }

        function refreshRestTimer() {
            const restEndTimeRaw = localStorage.getItem('restEndTime');
            if (!restEndTimeRaw) {
                restTimerWidget.style.display = 'none';
                return;
            }
            const restEndTime = Number(restEndTimeRaw);
            const secondsRemaining = Math.ceil((restEndTime - Date.now()) / 1000);

            if (secondsRemaining > 0) {
                restTimerWidget.style.display = 'block';
                restTimerValue.textContent = formatTime(secondsRemaining);
                hasBeeped = false;
                return;
            }

            localStorage.removeItem('restEndTime');
            restTimerWidget.style.display = 'none';
            if (!hasBeeped) {
                playBeep();
                hasBeeped = true;
            }
        }

        refreshRestTimer();
        restTimerInterval = window.setInterval(refreshRestTimer, 1000);

        const activeIndex = sessionStorage.getItem('activeExerciseIndex');
        if (activeIndex) {
            switchTab(activeIndex);
        }

        const savedScrollPos = sessionStorage.getItem('workoutScrollPos');
        if (savedScrollPos !== null) {
            window.scrollTo(0, parseInt(savedScrollPos, 10));
            sessionStorage.removeItem('workoutScrollPos');
        }

        document.querySelectorAll('form').forEach(function (form) {
            form.addEventListener('submit', function () {
                isSubmitting = true;
                if (form.dataset.scrollSave === 'true') {
                    sessionStorage.setItem('workoutScrollPos', String(window.scrollY));
                }
                if (form.dataset.restForm === 'true') {
                    const restSecondsInput = form.querySelector('.rest-seconds-value');
                    const restSeconds = Number(restSecondsInput ? restSecondsInput.value : 0);
                    if (Number.isFinite(restSeconds) && restSeconds >= 0) {
                        localStorage.setItem('restEndTime', String(Date.now() + restSeconds * 1000));
                        hasBeeped = false;
                    }
                }
            });
        });

        document.querySelectorAll('a.menu-item').forEach(function (menuLink) {
            menuLink.classList.add('workout-nav-locked');
            menuLink.addEventListener('click', function (e) {
                e.preventDefault();
            });
            menuLink.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                }
            });
        });
        window.addEventListener('beforeunload', function (e) {
            if (isSubmitting) {
                return;
            }
            e.preventDefault();
            e.returnValue = '';
        });
    });
</script>
</body>
</html>
